services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: alphaprotrade-postgres
    restart: unless-stopped
    env_file:
      - .postgres.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - alphaprotrade-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - alphaprotrade

networks:
  alphaprotrade:
    name: alphaprotrade-net
    driver: bridge

volumes:
  alphaprotrade-pgdata:
    name: alphaprotrade-pgdata
