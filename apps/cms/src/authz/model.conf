[request_definition]
r = sub, obj, act, ctx

[policy_definition]
p = role, obj, act, scope, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.sub.accountStatus == "active" && (r.sub.role == p.role || g(r.sub.role, p.role)) && (p.obj == "*" || r.obj.type == p.obj) && (p.act == "*" || r.act == p.act) && (p.scope == "all" || (p.scope == "own" && r.obj.attributes.ownerId == r.sub.id)) && (r.ctx.targetIsSelf != true || (r.act != "assign_role" && r.act != "assign_privileged_role" && r.act != "manage_user_status")) && r.ctx.tenantId == r.obj.attributes.tenantId
